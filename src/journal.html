<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Gratitude — Today's Page</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="journal.css" />
</head>
<body>
  <div class="book-stage" id="book-stage" aria-hidden="true">
    <div class="book">
      <div class="page-stack">
        <div class="sheet"></div>
        <div class="sheet"></div>
        <div class="sheet"></div>
        <div class="sheet"></div>
        <div class="sheet"></div>
        <div class="sheet"></div>
      </div>
      <div class="cover-panel" id="cover-panel">
        <div class="cover-inner">
          <span class="cover-mark" aria-hidden="true">
            <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#f3ded2" stroke-width="1.3" stroke-linecap="round">
              <circle cx="12" cy="13.5" r="4"></circle>
              <line x1="12" y1="3.2" x2="12" y2="6"></line>
              <line x1="3.8" y1="13.5" x2="1.5" y2="13.5"></line>
              <line x1="22.5" y1="13.5" x2="20.2" y2="13.5"></line>
              <line x1="5.6" y1="7.1" x2="4" y2="5.5"></line>
              <line x1="18.4" y1="7.1" x2="20" y2="5.5"></line>
            </svg>
          </span>
          <div class="cover-title">Daily Gratitude</div>
          <div class="cover-subtitle">Morning Journal</div>
          <div class="cover-hint">Click to open</div>
        </div>
      </div>
    </div>
  </div>

  <svg class="bg-mark" width="900" height="900" viewBox="0 0 24 24" fill="none" stroke="#bf5a2e" stroke-width="0.7" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="13.5" r="4"></circle>
    <line x1="12" y1="3.2" x2="12" y2="6"></line>
    <line x1="3.8" y1="13.5" x2="1.5" y2="13.5"></line>
    <line x1="22.5" y1="13.5" x2="20.2" y2="13.5"></line>
    <line x1="5.6" y1="7.1" x2="4" y2="5.5"></line>
    <line x1="18.4" y1="7.1" x2="20" y2="5.5"></line>
  </svg>

  <div class="page">
    <div class="header">
      <span class="mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#bf5a2e" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="13.5" r="4"></circle>
          <line x1="12" y1="3.2" x2="12" y2="6"></line>
          <line x1="3.8" y1="13.5" x2="1.5" y2="13.5"></line>
          <line x1="22.5" y1="13.5" x2="20.2" y2="13.5"></line>
          <line x1="5.6" y1="7.1" x2="4" y2="5.5"></line>
          <line x1="18.4" y1="7.1" x2="20" y2="5.5"></line>
        </svg>
      </span>
      <span class="wordmark">Daily Gratitude</span>
    </div>

    <div class="rule"></div>

    <h1 class="date-heading" id="date-heading">Today</h1>

    <section class="prompt">
      <h2 class="prompt-label">I am grateful for…<span class="theme-chip" id="theme-chip" hidden></span></h2>
      <div class="lines">
        <div class="line-group">
          <label class="line-question" for="grateful-0">
            <span class="line-number">1</span>
            <span class="line-question-text" id="question-0"></span>
          </label>
          <div class="line-row">
            <textarea class="line-input" id="grateful-0" maxlength="400" rows="2" autocomplete="off" spellcheck="true"></textarea>
            <p class="line-readback" id="readback-0" hidden></p>
          </div>
        </div>
        <div class="line-group">
          <label class="line-question" for="grateful-1">
            <span class="line-number">2</span>
            <span class="line-question-text" id="question-1"></span>
          </label>
          <div class="line-row">
            <textarea class="line-input" id="grateful-1" maxlength="400" rows="2" autocomplete="off" spellcheck="true"></textarea>
            <p class="line-readback" id="readback-1" hidden></p>
          </div>
        </div>
        <div class="line-group">
          <label class="line-question" for="grateful-2">
            <span class="line-number">3</span>
            <span class="line-question-text" id="question-2"></span>
          </label>
          <div class="line-row">
            <textarea class="line-input" id="grateful-2" maxlength="400" rows="2" autocomplete="off" spellcheck="true"></textarea>
            <p class="line-readback" id="readback-2" hidden></p>
          </div>
        </div>
      </div>
      <p class="hint" id="grateful-hint" hidden>Add at least one thing you're grateful for to finish today's page.</p>
    </section>

    <div class="footer">
      <button class="primary-btn" id="done-btn" type="button">Done for today</button>
      <div class="done-state" id="done-state" hidden>
        <span class="done-label">Page written ✓</span>
        <button class="text-link" id="edit-btn" type="button">Edit today's page</button>
      </div>
      <span class="readonly-note" id="readonly-note" hidden>A page from the past</span>
    </div>

    <nav class="page-nav" id="page-nav" hidden>
      <button class="nav-btn" id="nav-prev" type="button">‹ Previous page</button>
      <button class="nav-btn nav-today" id="nav-today" type="button" hidden>Back to today</button>
      <button class="nav-btn" id="nav-next" type="button">Next page ›</button>
    </nav>
  </div>

  <!-- Shown once the book has swung shut on a finished page. -->
  <div class="finish-note" id="finish-note" hidden>
    <!-- tabindex so focus can land here once the note opens. It used to go to
         the dismiss button; without one, focus would stay behind on the page
         under the note and a screen reader would never announce the dialog. -->
    <div class="finish-card" role="dialog" aria-modal="true" aria-labelledby="finish-title" tabindex="-1">
      <span class="finish-mark" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#bf5a2e" stroke-width="1.4" stroke-linecap="round">
          <circle cx="12" cy="13.5" r="4"></circle>
          <line x1="12" y1="3.2" x2="12" y2="6"></line>
          <line x1="3.8" y1="13.5" x2="1.5" y2="13.5"></line>
          <line x1="22.5" y1="13.5" x2="20.2" y2="13.5"></line>
          <line x1="5.6" y1="7.1" x2="4" y2="5.5"></line>
          <line x1="18.4" y1="7.1" x2="20" y2="5.5"></line>
        </svg>
      </span>
      <h2 class="finish-title" id="finish-title">Thank you!</h2>
      <p class="finish-body" id="finish-body"></p>
      <p class="finish-count" id="finish-count" hidden></p>
    </div>
  </div>

  <script src="journal-data.js"></script>
  <script src="questions.js"></script>
  <script src="journal.js"></script>
</body>
</html>
