<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Gratitude</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="card">
    <div class="glasswrap">
      <div class="pad">
        <div class="header">
          <span class="mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a5502a" stroke-width="1.7" stroke-linecap="round">
              <circle cx="12" cy="13.5" r="4"></circle>
              <line x1="12" y1="3.2" x2="12" y2="6"></line>
              <line x1="3.8" y1="13.5" x2="1.5" y2="13.5"></line>
              <line x1="22.5" y1="13.5" x2="20.2" y2="13.5"></line>
              <line x1="5.6" y1="7.1" x2="4" y2="5.5"></line>
              <line x1="18.4" y1="7.1" x2="20" y2="5.5"></line>
            </svg>
          </span>
          <span class="wordmark">Daily Gratitude</span>
        </div>

        <p class="today-date" id="today-date"></p>
        <p class="today-theme" id="today-theme"></p>
      </div>

      <button class="glass" id="journal-link" type="button">
        <span class="knob" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5V6a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v13"></path>
            <path d="M6 17h12"></path>
            <path d="M9 8.5h6"></path>
          </svg>
        </span>
        <span class="glass-text">
          <span class="glass-eyebrow" id="journal-eyebrow">Today's page</span>
          <span class="journal-link-text">Write your gratitude journal</span>
        </span>
      </button>
    </div>

    <div class="foot">
      <div class="week" id="week" role="img" aria-label="Days written this week"></div>
      <button class="settings-toggle" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings">
        <span class="settings-chevron" aria-hidden="true">⌄</span> settings
      </button>
    </div>

    <div class="settings" id="settings" hidden>
      <div class="toggle-row">
        <span class="status" id="status-label">Notifications on</span>
        <label class="switch">
          <input type="checkbox" id="toggle" checked />
          <span class="slider"></span>
        </label>
      </div>
      <button class="test-link" id="test-notif" type="button">not seeing them?</button>
    </div>
  </div>

  <script src="notify.js"></script>
  <script src="journal-data.js"></script>
  <script src="questions.js"></script>
  <script src="popup.js"></script>
</body>
</html>
