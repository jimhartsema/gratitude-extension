<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Gratitude</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="card">
    <div class="pad">
      <div class="header">
        <span class="brand">
          <span class="mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bf5a2e" stroke-width="1.7" stroke-linecap="round">
              <circle cx="12" cy="13.5" r="4"></circle>
              <line x1="12" y1="3.2" x2="12" y2="6"></line>
              <line x1="3.8" y1="13.5" x2="1.5" y2="13.5"></line>
              <line x1="22.5" y1="13.5" x2="20.2" y2="13.5"></line>
              <line x1="5.6" y1="7.1" x2="4" y2="5.5"></line>
              <line x1="18.4" y1="7.1" x2="20" y2="5.5"></line>
            </svg>
          </span>
          <span class="wordmark">Daily Gratitude</span>
        </span>
        <button class="settings-toggle" id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings">
          <span class="settings-chevron" aria-hidden="true">⌄</span> settings
        </button>
      </div>

      <p class="today-date" id="today-date"></p>
      <p class="today-theme" id="today-theme"></p>

      <div class="week" id="week" role="img" aria-label="Days written this week"></div>
      <div class="week-labels" id="week-labels" aria-hidden="true"></div>
    </div>

    <div class="cta-wrap">
      <button class="journal-cta" id="journal-link" type="button">
        <span class="cta-text">
          <span class="cta-title" id="cta-title">Write today's daily gratitude journal</span>
          <span class="cta-sub" id="cta-sub">Three questions · five minutes</span>
        </span>
        <span class="cta-arrow" aria-hidden="true">→</span>
      </button>
    </div>

    <div class="settings" id="settings" hidden>
      <div class="toggle-row">
        <span class="status" id="status-label">Notifications on</span>
        <label class="switch">
          <input type="checkbox" id="toggle" checked />
          <span class="slider"></span>
        </label>
      </div>
      <button class="test-link" id="test-notif" type="button">not seeing them?</button>
    </div>
  </div>

  <script src="notify.js"></script>
  <script src="journal-data.js"></script>
  <script src="questions.js"></script>
  <script src="popup.js"></script>
</body>
</html>
